name: Test
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Derle
        run: dotnet build HukukErp.csproj -c Release
      - name: Birim testler
        run: dotnet test Tests/HukukErp.Tests.csproj -c Release
