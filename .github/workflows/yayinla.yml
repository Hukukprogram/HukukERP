name: Setup olustur ve yayinla
on:
  push:
    branches: [ main ]      # her "Push origin" sonrası otomatik yeni sürüm yayınlanır
  workflow_dispatch:
    inputs:
      surum:
        description: "Surum (ornek 1.0.1)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      # Elle çalıştırırken yazılan sürüm; otomatik çalışmada 1.<çalışma sayısı>.0 (her seferinde bir öncekinden büyük)
      SURUM: ${{ inputs.surum != '' && inputs.surum || format('1.{0}.0', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Guncelleme adresini yaz
        shell: bash
        run: echo "https://github.com/${{ github.repository }}" > guncelleme.txt
      - name: Derle
        run: dotnet publish HukukErp.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.SURUM }} -o publish
      - name: vpk kur
        run: dotnet tool install -g vpk --version 0.0.942
      - name: Onceki surumleri indir (fark paketi icin)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases
      - name: Paketle
        run: vpk pack --packId HukukERP --packVersion ${{ env.SURUM }} --packDir publish --mainExe HukukERP.exe --packTitle "HukukERP" --outputDir Releases --icon icon.ico
      - name: GitHub Release'e yukle
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases --publish --releaseName "HukukERP ${{ env.SURUM }}" --tag v${{ env.SURUM }}
      - name: Sihirbazli kurulum dosyasini uret
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DSurum=${{ env.SURUM }}" kurulum.iss
      - name: Kurulum dosyasini Release'e ekle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ env.SURUM }} Releases\HukukERP-Kurulum.exe --clobber
